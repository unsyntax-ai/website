<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000">
  <title>UNSYNTAX.AI</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="120" result="wide"/>
      <feComponentTransfer in="wide" result="wideSoft"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="34" result="tight"/>
