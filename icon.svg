      <feMerge><feMergeNode in="wideSoft"/><feMergeNode in="tightSoft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="2000" height="2000" fill="#0084FF"/>
  <g fill="#FFFFFF" filter="url(#glow)">
